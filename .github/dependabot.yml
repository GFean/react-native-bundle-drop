version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tbilisi
    open-pull-requests-limit: 3
    labels:
      - "type: dependencies"
      - "status: needs-triage"
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: react-native
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tbilisi
    open-pull-requests-limit: 3
    labels:
      - "type: dependencies"
      - "area: release"
      - "status: needs-triage"
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - "*"
