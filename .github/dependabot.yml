version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tbilisi
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
      - "status: needs-triage"
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tbilisi
    open-pull-requests-limit: 3
    labels:
      - "type: dependencies"
      - "area: release"
      - "status: needs-triage"
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
