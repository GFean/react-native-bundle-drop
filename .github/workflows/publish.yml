name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    name: Verify package
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Confirm the release tag matches package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const packageJson = require('./package.json');
          const releaseTag = process.env.RELEASE_TAG || '';
          const expectedTag = `v${packageJson.version}`;

          if (!/^v\d+\.\d+\.\d+$/.test(releaseTag)) {
            throw new Error(`Release tag must be a stable v* tag; received "${releaseTag}".`);
          }
          if (releaseTag !== expectedTag) {
            throw new Error(`Release tag ${releaseTag} does not match package version ${packageJson.version}.`);
          }
          NODE

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Run the complete release gate
        run: yarn verify:release

      - name: Create and inspect the npm package
        id: package
        run: |
          pack_output="$(npm pack --json)"
          printf '%s\n' "$pack_output"
          tarball="$(PACK_OUTPUT="$pack_output" node <<'NODE'
          const output = process.env.PACK_OUTPUT || '';
          const finalArrayStart = output.lastIndexOf('\n[');
          const jsonStart = finalArrayStart >= 0 ? finalArrayStart + 1 : output.indexOf('[');
          const jsonEnd = output.lastIndexOf(']');
          if (jsonStart < 0 || jsonEnd < jsonStart) {
            throw new Error('npm pack did not return a JSON result.');
          }
          const [result] = JSON.parse(output.slice(jsonStart, jsonEnd + 1));
          if (!result?.filename) {
            throw new Error('npm pack did not report a tarball filename.');
          }
          process.stdout.write(result.filename);
          NODE
          )"
          node scripts/inspect-package-tarball.cjs "$tarball"
          shasum -a 256 "$tarball" > "$tarball.sha256"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload the verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-npm-package
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Confirm the manual run is a dry run
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual verification completed; npm publish is not available from workflow_dispatch."

  publish-package:
    name: Publish package
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up trusted publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-npm-package
          path: release-artifact

      - name: Reconfirm the exact release artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          tarball="release-artifact/gfean-react-native-bundle-drop-${package_version}.tgz"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
          (
            cd release-artifact
            shasum -a 256 -c "gfean-react-native-bundle-drop-${package_version}.tgz.sha256"
          )
          node scripts/inspect-package-tarball.cjs "$tarball"

      - name: Install the trusted publishing npm client
        run: npm install --global npm@12.0.2

      - name: Publish to npm with provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="${RELEASE_TAG#v}"
          npm publish "./release-artifact/gfean-react-native-bundle-drop-${package_version}.tgz" --access public --provenance
