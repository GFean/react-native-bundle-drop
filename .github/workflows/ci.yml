name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE || '';
          const conventionalTitle = /^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+/;

          if (!conventionalTitle.test(title)) {
            console.error('PR title must use Conventional Commit format, for example: "fix(runtime): retain the active bundle".');
            process.exit(1);
          }
          NODE

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Run JavaScript verification gate
        run: yarn verify:quick

      - name: Pack the verified CLI
        run: |
          mkdir -p "$RUNNER_TEMP/cli-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/cli-package"

      - name: Share the package with runtime checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-compatibility-package
          path: ${{ runner.temp }}/cli-package/*.tgz
          retention-days: 3

  cli-compatibility:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: javascript
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.4
          - os: ubuntu-latest
            node: 22.0.0
          - os: ubuntu-latest
            node: 22.13.0
          - os: ubuntu-latest
            node: 24.15.0
          - os: windows-latest
            node: 20.19.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-compatibility-package
          path: ${{ runner.temp }}/cli-package
      - name: Test the installed package with native Node imports
        shell: bash
        run: node scripts/check-cli-compatibility.cjs "$RUNNER_TEMP"/cli-package/*.tgz

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Run bounded Android host tests
        run: yarn test:android

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Run bounded iOS host tests
        run: yarn test:ios
